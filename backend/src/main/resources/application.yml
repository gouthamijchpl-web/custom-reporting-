# Shared configuration. Environment specific overrides live in application-dev.yml and
# application-prod.yml; secrets are supplied through environment variables only.
spring:
  application:
    name: custom-reporting-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      # Limits are declared now so the future data upload module inherits safe defaults.
      max-file-size: 25MB
      max-request-size: 25MB
  mvc:
    throw-exception-if-no-handler-found: true
server:
  port: ${SERVER_PORT:8080}
  error:
    # Errors are rendered by GlobalExceptionHandler; never leak stack traces.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  compression:
    enabled: true
  shutdown: graceful

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    credential-encryption-key: ${APP_CREDENTIAL_ENCRYPTION_KEY:local-credential-key-change-before-production}
    jwt:
      # Overridden per environment. Must be at least 32 characters.
      secret: ${APP_JWT_SECRET:local-development-only-secret-change-me-please}
      issuer: custom-reporting
      access-token-ttl: 15m
    refresh-token:
      cookie-name: cr_refresh_token
      cookie-path: /api/v1/auth
      ttl: 1d
      remember-me-ttl: 30d
      secure-cookie: ${APP_REFRESH_COOKIE_SECURE:false}
      same-site: Lax
    lockout:
      max-failed-attempts: 5
      lock-duration: 15m
    password-reset:
      max-attempts: 5
      attempt-window: 15m
      cooldown: 45s
    # Production default: never disclose which half of the credentials was wrong.
    detailed-authentication-errors: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.customreporting: INFO
