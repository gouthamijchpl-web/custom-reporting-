spring:
  datasource:
    url: jdbc:h2:file:./data/customreporting
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://192.168.10.56:5173}
  security:
    detailed-authentication-errors: true

logging:
  level:
    com.customreporting: DEBUG
    org.hibernate.SQL: INFO
