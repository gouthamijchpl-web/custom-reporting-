# Production: every secret and connection detail comes from the environment.
# The application refuses to start if a required variable is missing.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    hibernate:
      # Schema changes are applied by a migration tool, never by Hibernate.
      ddl-auto: validate
    open-in-view: false

app:
  security:
    refresh-token:
      # HTTPS is mandatory in production, so the refresh cookie is secure-only.
      secure-cookie: true
      same-site: Strict
    # Never reveal whether an email address is registered.
    detailed-authentication-errors: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.customreporting: INFO
