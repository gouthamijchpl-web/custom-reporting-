spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Render overlaps the old and new instances during a deploy. Keep both pools below
      # Supabase's shared session-pool limit (15 clients) so Flyway can also connect.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

server:
  port: ${PORT:10000}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://custom-reporting-frontend.vercel.app}
  security:
    refresh-token:
      # Vercel and Render are different HTTPS sites, so the httpOnly refresh cookie must
      # explicitly permit credentialed cross-site requests in production.
      secure-cookie: true
      same-site: None
